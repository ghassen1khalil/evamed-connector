version: "3.9"

services:
  evamed-db:
    image: postgres:16
    container_name: evamed-db
    environment:
      POSTGRES_DB: evamed
      POSTGRES_USER: evamed
      POSTGRES_PASSWORD: evamed
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evamed"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - evamed-db-data:/var/lib/postgresql/data

  app:
    image: maven:3.9.6-eclipse-temurin-21
    container_name: evamed-app
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://evamed-db:5432/evamed
      SPRING_DATASOURCE_USERNAME: evamed
      SPRING_DATASOURCE_PASSWORD: evamed
    ports:
      - "8080:8080"
    depends_on:
      evamed-db:
        condition: service_healthy

volumes:
  evamed-db-data:
