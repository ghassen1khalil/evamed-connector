openapi: 3.0.3
info:
  title: Evamed Connector API
  description: |
    OpenAPI v3 specification exposing read-only operations for EVAMED data.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /projects:
    get:
      summary: List projects
      description: |
        Returns a paginated list of projects. All provided filters are combined with logical AND.
        Results are ordered by creation date descending unless a custom sort is provided.
      operationId: getProjects
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - name: projectManagerId
          in: query
          required: false
          description: Filter by the identifier of a project manager assigned to the project.
          schema:
            type: string
        - name: managementAssistantId
          in: query
          required: false
          description: Filter by the identifier of a management assistant assigned to the project.
          schema:
            type: string
        - name: number
          in: query
          required: false
          description: Filter by project number (exact match).
          schema:
            type: string
        - name: title
          in: query
          required: false
          description: Filter by project title (partial match supported).
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by project type.
          schema:
            type: string
        - name: applicationDomain
          in: query
          required: false
          description: Filter by application domain.
          schema:
            type: string
        - name: isSensitive
          in: query
          required: false
          description: Filter by sensitive flag.
          schema:
            type: boolean
        - name: creationAtFrom
          in: query
          required: false
          description: Include projects created on or after this timestamp.
          schema:
            type: string
            format: date-time
        - name: creationAtTo
          in: query
          required: false
          description: Include projects created on or before this timestamp.
          schema:
            type: string
            format: date-time
        - name: endAtFrom
          in: query
          required: false
          description: Include projects ending on or after this timestamp.
          schema:
            type: string
            format: date-time
        - name: endAtTo
          in: query
          required: false
          description: Include projects ending on or before this timestamp.
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          required: false
          description: Field used to sort results. Supported values are number, title, creationAt, endAt, type, and applicationDomain.
          schema:
            type: string
            enum:
              - number
              - title
              - creationAt
              - endAt
              - type
              - applicationDomain
            default: creationAt
        - name: sortDirection
          in: query
          required: false
          description: Sort direction applied to the sortBy field.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: Paginated list of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectResponse'
              examples:
                sample:
                  summary: Example project list
                  value:
                    items:
                      - id: "df6d2a95-3b7e-4f4f-8d4b-31d2a72bfb1e"
                        number: "PRJ-2024-001"
                        type: "clinical"
                        title: "Study on treatment efficacy"
                        isSensitive: false
                        applicationDomain: "pharmaceutical"
                        phases:
                          - beginDate: "2024-01-15"
                            endDate: "2024-06-15"
                            label: "Phase I"
                        projectManagers:
                          - firstName: "Alex"
                            lastName: "Durand"
                            isPrimary: true
                            isSecondary: false
                        managementAssistant: "Louise Martin"
                        creationAt: "2024-01-01T10:00:00Z"
                        endAt: "2024-12-31T18:00:00Z"
                    limit: 20
                    offset: 0
                    total: 1
        "400":
          description: Invalid query parameters supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: No projects matched the provided filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{projectId}:
    get:
      summary: Get project details
      description: Retrieves a single project by its identifier.
      operationId: getProjectById
      tags:
        - Projects
      parameters:
        - name: projectId
          in: path
          required: true
          description: Unique project identifier.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Project detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Invalid project identifier supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    PaginatedProjectResponse:
      type: object
      description: Standard paginated response envelope for projects.
      required:
        - items
        - limit
        - offset
        - total
      properties:
        items:
          type: array
          description: List of projects in the current page.
          items:
            $ref: '#/components/schemas/Project'
        limit:
          type: integer
          description: Number of items requested per page.
          minimum: 1
          maximum: 100
          default: 20
        offset:
          type: integer
          description: Zero-based index of the first item returned.
          minimum: 0
          default: 0
        total:
          type: integer
          description: Total number of projects matching the filters (without pagination).
          minimum: 0
    Project:
      type: object
      required:
        - id
        - number
        - type
        - title
        - isSensitive
        - applicationDomain
        - phases
        - projectManagers
        - managementAssistant
        - creationAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the project.
        number:
          type: string
          description: Business reference number of the project.
        type:
          type: string
          description: Category or nature of the project.
        title:
          type: string
          description: Descriptive title of the project.
        isSensitive:
          type: boolean
          description: Indicates whether the project handles sensitive data.
        applicationDomain:
          type: string
          description: Application domain of the project.
        phases:
          type: array
          description: Chronological list of the project phases.
          items:
            $ref: '#/components/schemas/Phase'
        projectManagers:
          type: array
          description: Primary and secondary managers supervising the project.
          items:
            $ref: '#/components/schemas/ProjectManager'
        managementAssistant:
          type: string
          description: Assistant assigned to the project management team.
        creationAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the project was created.
        endAt:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 timestamp when the project ended, if applicable.
    Phase:
      type: object
      required:
        - beginDate
        - endDate
        - label
      properties:
        beginDate:
          type: string
          format: date
          description: Phase start date.
        endDate:
          type: string
          format: date
          description: Phase end date.
        label:
          type: string
          description: Human-readable phase name.
    ProjectManager:
      type: object
      required:
        - firstName
        - lastName
        - isPrimary
        - isSecondary
      properties:
        firstName:
          type: string
          description: Manager's given name.
        lastName:
          type: string
          description: Manager's family name.
        isPrimary:
          type: boolean
          description: Indicates if the manager is the primary contact.
        isSecondary:
          type: boolean
          description: Indicates if the manager acts as secondary contact.
    ErrorResponse:
      type: object
      description: Standard error envelope returned by the API.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Application-specific error code.
        message:
          type: string
          description: Human-readable error description.
        details:
          description: Optional additional information about the error.
          nullable: true
          oneOf:
            - type: array
              items:
                type: string
            - type: object
              additionalProperties: true
  parameters:
    Offset:
      name: offset
      in: query
      description: Zero-based index of the first item to return.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      description: Number of items to return (maximum 100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
