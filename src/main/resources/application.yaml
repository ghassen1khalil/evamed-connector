spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/evamed}
    username: ${SPRING_DATASOURCE_USERNAME:evamed}
    password: ${SPRING_DATASOURCE_PASSWORD:evamed}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
